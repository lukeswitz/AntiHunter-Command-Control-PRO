services:
  postgres:
    image: postgres:16-alpine
    container_name: cc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: command_center
      POSTGRES_USER: command_center
      POSTGRES_PASSWORD: command_center
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U command_center -d command_center']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cc_backend
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - dialout
    networks:
      default:
        aliases:
          - backend
          - cc_backend
      signal: {}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://command_center:command_center@postgres:5432/command_center
      PORT: 3000
      HTTP_PREFIX: api
      LOG_LEVEL: info
      SERIAL_DEVICE: '/dev/ttyUSB0'
      SERIAL_BAUD: '115200'
      ALLOW_FOREVER: 'true'
      ALLOW_ERASE_FORCE: 'false'
      TRUST_PROXY: '1'
      LISTEN_HOST: '0.0.0.0'
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TS_ALLOWED_LOGINS: ${TS_ALLOWED_LOGINS:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      SIGNAL_API_URL: ${SIGNAL_API_URL:-http://signal-proxy:8080}
      SIGNAL_NUMBER: ${SIGNAL_NUMBER:-}
      SIGNAL_RECIPIENTS: ${SIGNAL_RECIPIENTS:-}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      MATRIX_ROOM_ID: ${MATRIX_ROOM_ID:-}
      AHCC_MATTER_ENABLED: ${AHCC_MATTER_ENABLED:-false}
      AHCC_MATTER_PASSCODE: ${AHCC_MATTER_PASSCODE:-}
      AHCC_MATTER_STORAGE: /app/data/matter
      AHCC_MATTER_INTERFACE: ${AHCC_MATTER_INTERFACE:-}
      REMOTE_ALERTS_SECRET_KEY: ${REMOTE_ALERTS_SECRET_KEY:-}
      AHCC_TS_UPSTREAM: ${AHCC_TS_UPSTREAM:-http://cc_frontend:80}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./.git:/app/.git:ro
      - matter-state:/app/data/matter
      - remote-secrets:/app/apps/backend/.secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: cc_frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: cc_tailscale
    profiles: ['remote']
    hostname: ${TS_HOSTNAME:-ahcc}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-ahcc}
      TS_EXTRA_ARGS: --advertise-tags=tag:ahcc
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    depends_on:
      frontend:
        condition: service_healthy

  signal-api:
    image: bbernhard/signal-cli-rest-api:0.100@sha256:2399d449123cdad56c4d859277e3b9127e1a00c4d2ab4601c239882609286cf8
    container_name: cc_signal
    profiles: ['signal']
    restart: unless-stopped
    environment:
      MODE: native
    networks:
      - signal-internal
    volumes:
      - signal-state:/home/.local/share/signal-cli

  signal-proxy:
    image: node:20-bookworm-slim
    container_name: cc_signal_proxy
    profiles: ['signal']
    restart: unless-stopped
    command: ['node', '/app/proxy.mjs']
    environment:
      SIGNAL_UPSTREAM: http://signal-api:8080
      PORT: '8080'
    volumes:
      - ./docker/signal-proxy/proxy.mjs:/app/proxy.mjs:ro
    networks:
      - signal
      - signal-internal
    depends_on:
      - signal-api

networks:
  signal: {}
  signal-internal: {}

volumes:
  postgres-data:
  tailscale-state:
  matter-state:
  signal-state:
  remote-secrets:
